name: EpicPunishments
version: '${version}'

main: net.epicpunishments.bootstrap.EpicPunishments
api-version: '26.2'
load: POSTWORLD

permissions:
  epicpunishments.command:
    description: Allows access to the EpicPunishments command.
    default: true
  epicpunishments.command.version:
    description: Allows viewing the EpicPunishments version.
    default: op
  epicpunishments.command.status:
    description: Allows viewing non-sensitive runtime and persistence health information.
    default: op
  epicpunishments.command.reload:
    description: Allows reloading supported EpicPunishments settings.
    default: op
  epicpunishments.notify.degraded:
    description: Receives warnings when login protection is degraded.
    default: op
  epicpunishments.punishment.ban:
    description: Allows creating player bans.
    default: op
  epicpunishments.punishment.ban.ip:
    description: Allows creating IP address bans.
    default: op
  epicpunishments.punishment.unban:
    description: Allows revoking player bans.
    default: op
  epicpunishments.punishment.mute:
    description: Allows creating player mutes.
    default: op
  epicpunishments.punishment.mute.ip:
    description: Allows creating IP address mutes.
    default: op
  epicpunishments.punishment.unmute:
    description: Allows revoking player mutes.
    default: op
  epicpunishments.punishment.warn:
    description: Allows creating player warnings.
    default: op
  epicpunishments.punishment.warn.ip:
    description: Allows creating IP address warnings.
    default: op
  epicpunishments.punishment.warnings:
    description: Allows viewing player warnings.
    default: op
  epicpunishments.punishment.history:
    description: Allows viewing player punishment history.
    default: op
  epicpunishments.punishment.history.ip:
    description: Allows viewing complete IP addresses and IP punishment history.
    default: op
  epicpunishments.punishment.override-exempt:
    description: Allows punishing otherwise exempt players.
    default: op
  epicpunishments.exempt:
    description: Exempts a player from ordinary moderation actions.
    default: false
  epicpunishments.notify.punishment:
    description: Receives local punishment notifications.
    default: op
  epicpunishments.report.create:
    description: Allows players to create reports.
    default: true
  epicpunishments.report.own:
    description: Allows players to list and view their own reports.
    default: true
  epicpunishments.report.staff.list:
    description: Allows staff to list reports.
    default: op
  epicpunishments.report.staff.view:
    description: Allows staff to view reports.
    default: op
  epicpunishments.report.staff.claim:
    description: Allows staff to claim reports.
    default: op
  epicpunishments.report.staff.respond:
    description: Allows staff to respond to reports.
    default: op
  epicpunishments.report.staff.resolve:
    description: Allows staff to resolve reports.
    default: op
  epicpunishments.report.staff.dismiss:
    description: Allows staff to dismiss reports.
    default: op
  epicpunishments.notify.report:
    description: Receives new report notifications.
    default: op
