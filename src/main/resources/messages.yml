command:
  usage: '<gold>Use <yellow>/epicpunishments \<subcommand></yellow>.</gold>'
  version: "<gold>EpicPunishments <yellow>{version}</yellow></gold>"
  reload-started: "<yellow>Reloading EpicPunishments configuration...</yellow>"
  reload-success: "<green>EpicPunishments configuration reloaded.</green>"
  reload-failed: "<red>Reload failed. The previous configuration is still active.</red>"
  not-ready: "<red>EpicPunishments is still starting. Try again shortly.</red>"

login:
  banned: "<red>You are banned: {reason}</red>"
  temporary-error: "<red>Moderation data is temporarily unavailable. Please try again shortly.</red>"
  degraded-warning: "<red><bold>Moderation protection is degraded</bold></red><red> while assessing player {player-id}. Check the server logs.</red>"

warning:
  received: "<gold>Warning: <yellow>{reason}</yellow></gold>"

punishment:
  usage: '<gold>Use <yellow>/epicpunishments punish <ban|unban|mute|unmute|warn|warnings|history></yellow>.</gold>'
  invalid-input: '<red>Invalid punishment input: {error}</red>'
  invalid-target: '<red>Use an explicit target such as player:Name, player:UUID, or ip:192.0.2.1.</red>'
  ip-permission-required: '<red>You do not have permission to moderate or view IP address targets.</red>'
  ip-applied: '<green>Applied {type} to {address}.</green>'
  ip-revoked: '<green>Revoked {count} active {type} punishment(s) for {address}.</green>'
  ip-history-header: '<gold>Punishment history for {address} (page {page}/{pages}):</gold>'
  target-not-found: '<red>No stored player matches that target.</red>'
  target-ambiguous: '<red>That historical name matches multiple players; use player:UUID.</red>'
  target-exempt: '<red>That player is exempt from punishments.</red>'
  applied: '<green>Applied {type} to {player}.</green>'
  revoked: '<green>Revoked {count} active {type} punishment(s) for {player}.</green>'
  no-active: '<yellow>No matching active punishment was found.</yellow>'
  history-header: '<gold>Punishment history for {player} (page {page}/{pages}):</gold>'
  history-entry: '<gray>{id} | {type} | {created} | {status} | {reason}</gray>'
  history-empty: '<yellow>No punishments were found on that page.</yellow>'
  command-failed: '<red>The moderation change could not be completed; no uncommitted local state was applied.</red>'
  unsupported-sender: '<red>This command can be used only by a player or the console.</red>'
  muted: '<red>You have been muted: {reason}</red>'
  mute-blocked: '<red>You cannot chat while muted: {reason}</red>'

report:
  usage: '<gold>Use <yellow>/epicpunishments report <create|status|list></yellow>.</gold>'
  invalid-input: '<red>Invalid report input: {error}</red>'
  player-only: '<red>Player report commands can only be used in game.</red>'
  unsupported-sender: '<red>This command can be used only by a player or the console.</red>'
  created: '<green>Created report {id} about {reported}.</green>'
  updated: '<green>Updated report {id}; status is now {status}.</green>'
  details: '<gold>{id} | {reporter} reported {reported} | {status} | assigned: {assignee} | {reason}</gold>'
  not-found: '<red>No report with that ID exists.</red>'
  not-owner: '<red>You can only view reports you created.</red>'
  target-not-found: '<red>No stored player matches that name.</red>'
  target-ambiguous: '<red>That historical name matches multiple players; ask staff for help identifying the account.</red>'
  self: '<red>You cannot report yourself.</red>'
  cooldown: '<yellow>Please wait before creating another report.</yellow>'
  duplicate: '<yellow>You already have an open report about that player.</yellow>'
  version-conflict: '<yellow>Another staff member updated that report. View it again before retrying.</yellow>'
  invalid-state: '<yellow>That report cannot be changed from its current state.</yellow>'
  list-header: '<gold>Reports (page {page}/{pages}):</gold>'
  list-entry: '<gray>{id} | {reported} | {status} | {created}</gray>'
  list-empty: '<yellow>No reports were found on that page.</yellow>'
  response-entry: '<gray>{created} | {actor}: {message}</gray>'
  command-failed: '<red>The report operation could not be completed.</red>'
  staff-notification: '<gold>New report {id}: {reporter} reported {reported}.</gold>'
  notification: '<gold>Your report {id} has an update. Use /epicpunishments report status {id}.</gold>'

reports:
  usage: '<gold>Use <yellow>/epicpunishments reports <list|view|claim|respond|resolve|dismiss></yellow>.</gold>'
